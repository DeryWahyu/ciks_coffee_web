name: Test and Deploy Web to Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: cikscoffee-ci-only
          MARIADB_DATABASE: cikscoffee_audit_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, gd, dom, xml, zip, curl, fileinfo, intl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and prepare isolated test environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction
          npm ci --ignore-scripts
      - name: Build assets required by HTML feature tests
        run: npm run build
      - name: Test application and deployment archive checks
        run: |
          php artisan test
          python3 -m unittest discover -s deployment/ubuntu/tests -v
      - name: Test transactional consistency on MariaDB
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: cikscoffee_audit_ci
          DB_USERNAME: root
          DB_PASSWORD: cikscoffee-ci-only
          DB_URL: ''
        run: |
          php artisan test
          php artisan test tests/Integration/CheckoutConcurrencyTest.php
      - name: Install production dependencies
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Package production release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash deployment/ubuntu/build-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/cikscoffee-web.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: web-production-${{ github.sha }}
          path: ${{ runner.temp }}/cikscoffee-web.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-production-${{ github.sha }}
          path: release
      - name: Deploy release to isolated Docker stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_PORT:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_KNOWN_HOSTS:?}"
          install -d -m 0700 "$RUNNER_TEMP/vps-ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/vps-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/vps-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/vps-ssh/key"
          trap 'rm -f "$RUNNER_TEMP/vps-ssh/key"' EXIT
          digest=$(sha256sum release/cikscoffee-web.tar.gz | cut -d ' ' -f 1)
          ssh -T -i "$RUNNER_TEMP/vps-ssh/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA $digest" < release/cikscoffee-web.tar.gz
      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 https://cikscoffee.biz.id/up > /dev/null
          printf 'Deployed commit %s to https://cikscoffee.biz.id\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
