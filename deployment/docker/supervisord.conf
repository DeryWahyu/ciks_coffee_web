[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:cikscoffee-php]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cikscoffee-nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cikscoffee-queue]
directory=/var/www/cikscoffee
command=/usr/local/bin/php -d memory_limit=192M artisan queue:work database --sleep=3 --tries=3 --timeout=60 --memory=128 --max-time=3600
user=www-data
priority=30
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=70
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cikscoffee-queue.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:cikscoffee-reverb]
directory=/var/www/cikscoffee
command=/usr/local/bin/php -d memory_limit=192M artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
priority=30
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cikscoffee-reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:cikscoffee-cron]
command=/usr/sbin/cron -f
priority=40
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
