[program:cikscoffee-queue]
directory=/var/www/cikscoffee
command=/usr/bin/php -d memory_limit=192M artisan queue:work database --sleep=3 --tries=3 --timeout=60 --memory=128 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=70
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cikscoffee-queue.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:cikscoffee-reverb]
directory=/var/www/cikscoffee
command=/usr/bin/php -d memory_limit=192M artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cikscoffee-reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
